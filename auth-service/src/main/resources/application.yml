server:
  port: 8084

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:8889/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

# Authentication settings. NOTE: app.jwt.secret MUST be identical in gateway-service.
app:
  jwt:
    secret: "${JWT_SECRET}"
    access-expiration-ms: 900000        # 15 minutes
  refresh:
    expiration-days: 7
  cookie:
    secure: false                        # set true behind HTTPS in production
