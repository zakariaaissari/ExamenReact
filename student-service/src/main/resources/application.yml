server:
  port: 8081

spring:
  application:
    name: student-service   # This name is what Eureka registers and what Feign uses to locate this service

  datasource:
    url: jdbc:mysql://localhost:8889/db_students?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'update' creates/updates tables automatically from entities — fine for dev.
      # Use 'validate' or Flyway/Liquibase in production.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Feign client timeout configuration
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health, info

# Grade computation thresholds (all optional — these are the defaults).
grade:
  pass-mark: 10.0
  mention:
    passable: 10.0
    assez-bien: 12.0
    bien: 14.0
    tres-bien: 16.0

# Relevé (transcript) header/footer text — change per institution, not hardcoded.
releve:
  institution: "ISGA Rabat"
  academic-year: "2025-2026"
  lieu: "Rabat"
